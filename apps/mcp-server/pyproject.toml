[project]
name = "mind-of-christ-mcp"
version = "0.1.0"
description = "MCP server exposing the Mind of Christ knowledge system as tools"
requires-python = ">=3.12"
dependencies = [
    "loguru==0.7.3",
    "mcp==2.2.0",
    "mind-of-christ==0.1.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "anyio==4.15.1",
]

[project.scripts]
mind-of-christ-mcp = "mind_of_christ_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
