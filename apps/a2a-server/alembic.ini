# Alembic owns all DDL for this server (a2a_tasks + conversation tables). The app runs
# with create_table=False on the task store; `alembic upgrade head` is a pre-start step,
# never run at FastAPI startup. env.py builds its own async engine from DATABASE_URL, so
# sqlalchemy.url below is an unused placeholder the CLI still requires.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
