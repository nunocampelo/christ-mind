[project]
name = "mind-of-christ-agent"
version = "0.1.0"
description = "The orchestrator agent: an LLM that maps situations to concepts and calls the deterministic Mind of Christ MCP tools"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "mind-of-christ==0.1.0",
    "mind-of-christ-mcp==0.1.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "anyio==4.15.1",
]

[project.scripts]
mind-of-christ-agent = "mind_of_christ_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
